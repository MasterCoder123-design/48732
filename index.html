<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Dash 3D</title>
  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three@0.150.1';

  const canvas = document.querySelector('#game');
  const renderer = new THREE.WebGLRenderer({ canvas });
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#1a1a1a');

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 10;
  camera.position.y = 5;

  const light = new THREE.PointLight(0xffffff, 1, 100);
  light.position.set(10, 10, 10);
  scene.add(light);

  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const colors = ['#ff4c4c', '#4cffd7', '#fffb4c', '#4c6eff'];

  const platforms = [];
  for (let i = 0; i < 50; i++) {
    const material = new THREE.MeshStandardMaterial({ color: colors[i % colors.length] });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.z = -i * 2;
    cube.position.x = (Math.random() - 0.5) * 5;
    cube.position.y = (Math.random() - 0.5) * 1;
    scene.add(cube);
    platforms.push(cube);
  }

  const playerGeometry = new THREE.SphereGeometry(0.5, 32, 32);
  const playerMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff' });
  const player = new THREE.Mesh(playerGeometry, playerMaterial);
  player.position.y = 1;
  scene.add(player);

  let speed = 0.2;
  let moveLeft = false;
  let moveRight = false;

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') moveLeft = true;
    if (e.key === 'ArrowRight') moveRight = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') moveLeft = false;
    if (e.key === 'ArrowRight') moveRight = false;
  });

  function animate() {
    requestAnimationFrame(animate);

    if (moveLeft) player.position.x -= 0.1;
    if (moveRight) player.position.x += 0.1;

    player.position.z -= speed;
    camera.position.z = player.position.z + 5;

    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
